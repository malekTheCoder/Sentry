name: MacStat
options:
  bundleIdPrefix: dev.malekswilam.macstat
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.0
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0

targets:
  SystemMetricsKit:
    type: framework
    platform: macOS
    sources:
      - path: SystemMetricsKit
    dependencies:
      - target: MacStatKit_macOS
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.systemmetricskit
      # Frameworks embedded into an .app must carry an Info.plist — Xcode
      # validates this at the embed step and fails the build without it.
      # Matches the equivalent setting on MacStatKit_iOS below.
      GENERATE_INFOPLIST_FILE: YES

  MacStatKit_macOS:
    type: framework
    platform: macOS
    sources:
      - path: MacStatKit
    dependencies:
      - package: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.kit
      PRODUCT_NAME: MacStatKit
      PRODUCT_MODULE_NAME: MacStatKit
      # See the note on SystemMetricsKit above — embedded frameworks need an
      # Info.plist or the MacStat app target fails at the embed step.
      GENERATE_INFOPLIST_FILE: YES

  MacStatKit_iOS:
    type: framework
    platform: iOS
    sources:
      - path: MacStatKit
    dependencies:
      - package: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.kit
      PRODUCT_NAME: MacStatKit
      PRODUCT_MODULE_NAME: MacStatKit
      GENERATE_INFOPLIST_FILE: YES

  MacStat:
    type: application
    platform: macOS
    sources:
      - path: MacStat
    dependencies:
      - target: MacStatKit_macOS
        embed: true
      - target: SystemMetricsKit
        embed: true
      - target: MacStatWidgetExtension_macOS
        embed: true
      - package: Sparkle
        embed: false
        link: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      # Hardened runtime turns on library validation, which rejects the
      # ad-hoc-signed frameworks this dev-signing setup embeds. Re-enable for
      # a real Developer-ID release build.
      ENABLE_HARDENED_RUNTIME: NO
      APP_SANDBOX: NO
      # Ad-hoc signing (identity "-") so the embedded widget appex carries a
      # signature chronod will load. Deliberately NO App Group entitlement on
      # the macOS side: Xcode requires a provisioning profile for iOS-style
      # `group.*` groups on macOS, which an ad-hoc/no-team setup can't
      # produce. `WidgetSnapshotStore` uses a plain (non-group) suite on
      # macOS instead — see its doc comment.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "-"
    info:
      path: MacStat/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MacStat
        NSHumanReadableCopyright: "Malek Swilam"

  MacStatMobile:
    type: application
    platform: iOS
    sources:
      - path: MacStatMobile
    dependencies:
      - target: MacStatKit_iOS
        embed: true
      - target: MacStatWidgetExtension
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile
      # Simulator builds don't need a signing team, but they DO need the
      # entitlements actually embedded (codesign runs even for the "Sign to
      # Run Locally" identity Xcode uses on Simulator) for the App Group
      # container behind `WidgetSnapshotStore` to work — that's real, not
      # just cosmetic, unlike the project-wide CODE_SIGNING_ALLOWED: NO
      # default in the `base` settings block above, which fully suppresses
      # signing (and therefore entitlement embedding) for the targets that
      # never asked for one. See `WidgetSnapshotStore.swift`'s doc comment
      # for what happens if this ever regresses.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatMobile/MacStatMobile.entitlements
    info:
      path: MacStatMobile/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for `LocalSyncClient` (`MacStatKit/LocalSync/LocalSyncClient.swift`)
        # to browse for and connect to `LocalSyncServer` over Bonjour/
        # `Network.framework` — iOS gates both local-network `NWBrowser`
        # discovery and any Bonjour service lookup behind these two entries,
        # prompting the user the first time either is used. See
        # `StatsTransport.swift`'s doc comment for why this transport exists
        # at all (CloudKit is blocked on Apple Developer Program enrollment;
        # this one isn't).
        NSLocalNetworkUsageDescription: "MacStat uses your local network to show live data from your Mac when you're on the same Wi-Fi."
        NSBonjourServices:
          - "_macstat._tcp"

  MacStatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      # Both widget targets generate an Info plist into this same directory
      # (Info.plist for iOS, Info-macOS.plist for macOS); excluded here so
      # neither target bundles the other's plist as a stray resource —
      # embeddedBinaryValidationUtility rejects an appex containing a plist
      # whose CFBundleIdentifier isn't prefixed by the parent app's.
      - path: MacStatWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: MacStatKit_iOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile.widget
      PRODUCT_NAME: MacStatWidget
      # See the matching comment on the `MacStatMobile` target above — same
      # reasoning, same App Group, same requirement that entitlements are
      # actually embedded even for an unsigned-by-default project.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatWidget/MacStatWidget.entitlements
    info:
      path: MacStatWidget/Info.plist
      properties:
        CFBundleDisplayName: MacStat Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacStatWidgetExtension_macOS:
    type: app-extension
    platform: macOS
    sources:
      # Same exclusion as MacStatWidgetExtension above.
      - path: MacStatWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: MacStatKit_macOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.widget
      PRODUCT_NAME: MacStatWidget
      # Ad-hoc signed, no entitlements — same provisioning constraint as the
      # MacStat app target above; the store's macOS suite needs none.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "-"
    info:
      # Its own generated plist path — the iOS extension's `info:` block
      # already generates MacStatWidget/Info.plist, and two targets writing
      # one path would race on content.
      path: MacStatWidget/Info-macOS.plist
      properties:
        CFBundleDisplayName: MacStat Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacStatMCP:
    type: tool
    platform: macOS
    sources:
      - path: MacStatMCP
    dependencies:
      - target: MacStatKit_macOS
        embed: false
      - package: MCP
        product: MCP
        embed: false
        link: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mcp

  MacStatCLI:
    type: tool
    platform: macOS
    sources:
      - path: MacStatCLI
    dependencies:
      - target: MacStatKit_macOS
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.cli
      # EXECUTABLE_NAME (not PRODUCT_NAME) renames just the output binary to
      # "macstat" — PRODUCT_NAME stays "MacStatCLI" so the module name it
      # implies doesn't collide with the "MacStat" app target's own module
      # on a case-insensitive filesystem (this collided as "cannot load
      # module 'macstat' as 'MacStat'" when PRODUCT_NAME was set directly).
      EXECUTABLE_NAME: macstat

  MacStatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacStatTests
    dependencies:
      - target: MacStat
      - target: MacStatKit_macOS
      - target: SystemMetricsKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.tests

schemes:
  MacStat:
    build:
      targets:
        MacStat: all
        MacStatMCP: all
        MacStatCLI: all
        MacStatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacStatTests
