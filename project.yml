name: Sentry
options:
  bundleIdPrefix: dev.malekswilam.sentry
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    # watchOS 10 is the first release where accessoryCorner-style
    # WidgetKit complications and the modern (no legacy WatchKit
    # extension) single-target watch app shape are both available —
    # SentryWatch/SentryWatchWidget below rely on both.
    watchOS: "10.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Automatic signing everywhere with the maintainers' Apple Developer team.
# Frameworks, CLI, and test bundles all sign
# with Apple Development; no target needs a provisioning profile unless it
# carries restricted entitlements. The Release-configuration strictness that
# notarization demands lives in the `DeveloperIDSigned` target template below
# rather than here — this block is shared with the iOS and watchOS targets, for
# which "Developer ID Application" is not a valid identity at all.
settings:
  base:
    SWIFT_VERSION: "5.9"
    # The permissive floor, restored. Promoting `Apple Development` + a real
    # team to the *project-wide* base broke `xcodebuild ... test` outright on
    # any machine without that team's certificates — 8 "No signing certificate"
    # errors across SentryCLI, SentryMCP, SentryFanDaemon and SentryTests,
    # so the macOS suite could not run at all. Verified against origin/main in
    # a clean worktree, so this was not a merge artefact.
    #
    # The change was also redundant: every target that genuinely needs a real
    # identity for device deployment (SentryMobile, its widget, SentryWatch,
    # its widget) already sets CODE_SIGN_STYLE/DEVELOPMENT_TEAM on itself, and
    # the Release strictness notarization requires lives in the
    # `DeveloperIDSigned` template. Neither needed the base to change.
    #
    # This floor is load-bearing: a checkout on a Mac with zero signing
    # identities must still build and run its tests, because that is how the
    # suite is run here and in any future CI. Do not promote a real identity
    # here again — set it on the targets that need it.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    # ---------------------------------------------------------------------
    # Release version, project-wide — promoted here from the `Sentry` target.
    #
    # The macOS target's `info:` block already carries a long comment about
    # why XcodeGen's default "1.0"/"1" in a generated Info.plist is a real
    # bug rather than cosmetics (Sparkle compares the *plist* keys, not the
    # build settings, so a build announcing itself as "1.0" considers every
    # release in the feed older than itself and updates to nothing, forever).
    # That comment ends with "there is no second place to forget."
    #
    # There were four. `SentryMobile`, `SentryWidgetExtension`, `SentryWatch`
    # and `SentryWatchWidgetExtension` set no version at all and had no
    # CFBundle* substitution in their `info:` blocks, so every one of them
    # generated CFBundleShortVersionString "1.0" / CFBundleVersion "1" while
    # this repository's tag said 1.0.0 (build 2). On the Mac that mistake
    # breaks updates; on the App Store it is worse, because App Store Connect
    # requires an embedded watch app and every app extension to carry the
    # *same* CFBundleShortVersionString and CFBundleVersion as the containing
    # iOS app, and rejects the upload when they disagree. They agreed only by
    # accident here — all four were wrong in the same direction.
    #
    # Promoted to the project base rather than repeated on four targets so
    # that a release bump stays one edit. The `Sentry` target keeps its own
    # identical values in `settings.base`: an explicit override with the same
    # numbers changes nothing about the notarized/Sparkle build, and leaving
    # it in place keeps the macOS release path independent of an edit made
    # for the iOS one.
    #
    # CURRENT_PROJECT_VERSION must be bumped for every *upload* to App Store
    # Connect, not every release — ASC rejects a build whose number it has
    # already seen for this CFBundleShortVersionString, even if the previous
    # upload was never submitted.
    # ---------------------------------------------------------------------
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"

# Applied to every macOS target whose product ends up inside (or alongside) the
# notarized Sentry.app: the app, the two embedded frameworks, the widget appex,
# and the two command-line tools. Everything it sets is scoped to Release, so
# adopting the template changes nothing about a Debug build.
#
# Notarization is non-negotiable about all four of these:
#
#   * A real `Developer ID Application` identity, from an enrolled Apple
#     Developer Program team. Ad-hoc ("-") signatures are rejected outright.
#   * Hardened runtime on every Mach-O in the bundle — not just the main
#     executable. A single nested binary without it fails the submission.
#   * A secure timestamp. `--timestamp` is passed explicitly rather than relying
#     on xcodebuild's archive-time default, because that default differs between
#     `build` and `archive` and a missing timestamp is a submission failure with
#     an unhelpful message.
#   * No `com.apple.security.get-task-allow`. Xcode injects it through
#     CODE_SIGN_INJECT_BASE_ENTITLEMENTS so debuggers can attach; turning the
#     injection off for Release is what guarantees it cannot ride along into an
#     archive. (It stays on for Debug, where attaching a debugger is the point.)
#
# CODE_SIGNING_REQUIRED: YES is the important negative test here. Without it, a
# Release build on a machine with no Developer ID certificate would quietly fall
# back to producing an unsigned bundle and only fail much later, at
# `notarytool submit`. With it, `xcodebuild archive` fails immediately and says
# which identity it could not find.
targetTemplates:
  DeveloperIDSigned:
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          DEVELOPMENT_TEAM: H7T2D2GL7U
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  # The app's only update channel — Sentry ships outside the Mac App Store
  # (Developer ID + notarization), so there is no StoreKit update path. See
  # `Sentry/App/UpdateController.swift` and `docs/sparkle-release-signing.md`.
  #
  # Floor raised from 2.6.0 to 2.9.0 (current release: 2.9.4) for two fixes
  # that matter to a first-ever release rather than to an upgrade: the
  # signed-appcast handling and the delta-update validation corrections. A
  # build that ships on 2.6.x and only discovers the difference when a delta
  # silently fails to apply has no way to push a fix — the broken updater is
  # the thing that would have delivered it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.0
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
  # For MCPRemoteServer (Sentry/App/MCPRemoteServer.swift) — the TCP+HTTP/1.1
  # framing layer under the MCP SDK's framework-agnostic HTTPRequest/
  # HTTPResponse types, which ship no socket listener of their own. Standard
  # SSWG-maintained choice rather than a hand-rolled HTTP parser over
  # NWListener, given this is a security-relevant surface (see
  # MCPRemoteServer's doc comment).
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0

targets:
  SystemMetricsKit:
    type: framework
    platform: macOS
    # Embedded in Sentry.app/Contents/Frameworks, so it is nested code the
    # notary service inspects in its own right — see the template's comment.
    templates:
      - DeveloperIDSigned
    sources:
      - path: SystemMetricsKit
    dependencies:
      - target: SentryKit_macOS
        embed: false
    # Spelled out as `base:` rather than the flat `settings: {KEY: value}` form
    # every other target uses. That is not style: a target that adopts a
    # template carrying `settings.configs` (as this one does, above) silently
    # loses its flat settings during the merge — PRODUCT_NAME, bundle id and all
    # — and the failure surfaces much later as "unable to resolve module
    # dependency" from whatever imports the misnamed framework. Same reason for
    # the identical shape on SentryKit_macOS, SentryMCP and SentryCLI below.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.systemmetricskit
        # Frameworks embedded into an .app must carry an Info.plist — Xcode
        # validates this at the embed step and fails the build without it.
        # Matches the equivalent setting on SentryKit_iOS below.
        GENERATE_INFOPLIST_FILE: YES

  SentryKit_macOS:
    type: framework
    platform: macOS
    # Embedded in Sentry.app/Contents/Frameworks — same reasoning as
    # SystemMetricsKit above. The iOS and watchOS variants of this target
    # deliberately do NOT adopt the template: "Developer ID Application" is a
    # Mac-only identity.
    templates:
      - DeveloperIDSigned
    # SentryKit/Resources/Localizable.xcstrings (String Catalog, source
    # language en) lives under this same `sources: path` and is auto-detected
    # by XcodeGen as a resource (not compiled Swift) purely from its
    # extension — no separate `resources:` entry needed. Holds the shared
    # vocabulary used by both apps: MetricID.shortLabel/MetricModule
    # .displayName, HistoryRange.label/accessibilityLabel, MenuBarLayout's
    # DisplayMode/SeparatorStyle.displayName, MCPTool.displayName/
    # toolDescription/riskLabel. See Sentry/Resources/Localizable.xcstrings
    # and SentryMobile/Resources/Localizable.xcstrings for the per-app
    # catalogs (Dropdown/Settings/Dashboard-window strings; iOS Alerts-tab
    # strings) — kept separate per target rather than one shared catalog so
    # each app only ships the strings it actually uses.
    sources:
      - path: SentryKit
    dependencies:
      - package: GRDB
      # SentryKit/MCP/ (MCPToolCatalog, ResourceCatalog) is #if os(macOS)-
      # gated — see those files' doc comments for why the tool/resource
      # dispatch logic shared by both MCP transports (stdio SentryMCP, and
      # the in-app remote MCPRemoteServer) lives here rather than in the
      # SentryMCP executable target alone. Not added to SentryKit_iOS
      # below: that target compiles the same source directory, but the
      # entire `import MCP` + implementation sits behind the same macOS
      # guard, so iOS never needs this package to resolve.
      - package: MCP
        product: MCP
        embed: false
        link: true
    # `base:` rather than the flat form — see the note on SystemMetricsKit above
    # for why adopting a template forces this shape.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.kit
        PRODUCT_NAME: SentryKit
        PRODUCT_MODULE_NAME: SentryKit
        # See the note on SystemMetricsKit above — embedded frameworks need an
        # Info.plist or the Sentry app target fails at the embed step.
        GENERATE_INFOPLIST_FILE: YES

  SentryKit_iOS:
    type: framework
    platform: iOS
    sources:
      - path: SentryKit
    dependencies:
      - package: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.kit
      PRODUCT_NAME: SentryKit
      PRODUCT_MODULE_NAME: SentryKit
      GENERATE_INFOPLIST_FILE: YES

  SentryKit_watchOS:
    type: framework
    platform: watchOS
    # Deliberately NOT `- path: SentryKit` (the whole directory, the way
    # SentryKit_macOS/SentryKit_iOS above do it) — most of SentryKit is
    # macOS-only IOKit/XPC/MCP code or depends on GRDB, neither of which the
    # Watch side of this feature needs at all. SentryWatch and
    # SentryWatchWidgetExtension only ever need the relay payload type
    # (`WatchRelaySnapshot`/`WatchRelayStore`, `SentryKit/Watch/`) and the
    # freshness-labeling helpers (`Freshness`/`FreshnessBadge`,
    # `SentryKit/Sync/`) — both already pure Foundation/SwiftUI with no
    # platform-specific import, so enumerating files one by one keeps this
    # target's compile surface (and its risk of picking up something watchOS
    # can't build) as small as the feature actually requires.
    #
    # This list has a second job it did not start with: it is the evidence
    # behind SentryWatch/PrivacyInfo.xcprivacy and
    # SentryWatchWidget/PrivacyInfo.xcprivacy, both of which argue that the
    # boot-time and `UserDefaults.standard` required-reason call sites the
    # iPhone must declare are absent from the watch binaries. That argument
    # is only as true as this list, so anything added below has to be checked
    # against those two manifests in the same commit. It has already grown
    # from three entries to seven (eleven files) for theming and Siri intents
    # while the prose here still said "three."
    sources:
      - path: SentryKit/Watch
      - path: SentryKit/Sync/Freshness.swift
      - path: SentryKit/Sync/FreshnessBadge.swift
      # Added for the Watch Siri intents (SentryWatch/Intents/
      # SentryWatchIntents.swift): ControlCommand/ControlStatus, so the
      # watch constructs and decodes the real types rather than duplicating
      # them. SyncModels.swift imports only Foundation, so it builds on
      # watchOS unchanged.
      - path: SentryKit/Sync/SyncModels.swift
      # Added for the Watch UI redesign: the watch renders in the user's
      # chosen theme rather than in hardcoded system colors, so it needs the
      # real `Theme`/`ThemeColor` types the Mac and phone already share
      # (which theme is chosen travels in `WatchRelaySnapshot.themeID`).
      # Both files import only Foundation and CoreGraphics — no AppKit, no
      # GRDB — so they compile on watchOS unchanged, and using the real ones
      # is what keeps a palette tweak on the Mac from silently failing to
      # reach the wrist.
      - path: SentryKit/Settings/Theme.swift
      - path: SentryKit/Settings/ThemeTokens.swift
      # Pulled in by the two `Theme` extensions that look a color up by
      # metric — and worth having on its own terms: it means the watch's
      # CPU/MEM/DISK dials ask the theme for the *same* per-metric colors the
      # Mac's own charts use (`theme.metricColor(for: .cpuTotalPercent)`)
      # instead of inventing a parallel palette that drifts. Self-contained:
      # imports Foundation and declares MetricModule/MetricUnit itself.
      - path: SentryKit/Models/MetricID.swift
      # WCAG relative-luminance and contrast math, used by `WatchPalette`
      # (SentryWatch/Theme/WatchPalette.swift) to guarantee that whichever
      # theme is relayed stays readable against the watch's black canvas —
      # including the light presets (Paper, Ivory, GitHub), whose tokens are
      # authored for a white page. Pure Foundation.
      - path: SentryKit/Settings/ThemeContrast.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.kit.watch
      PRODUCT_NAME: SentryKit
      PRODUCT_MODULE_NAME: SentryKit
      GENERATE_INFOPLIST_FILE: YES

  Sentry:
    type: application
    platform: macOS
    templates:
      - DeveloperIDSigned
    # Sentry/Resources/Localizable.xcstrings — same auto-detected-by-
    # extension mechanism as SentryKit_macOS above. Covers this target's own
    # display strings (Settings sidebar pane titles, Dashboard's
    # TimeRangePicker, AlertsPane's condition/duration/unit formatting, the
    # MCP tool-confirmation NSAlert, window titles). SwiftUI `Text("literal")`
    # / `Label("literal", systemImage:)` / `Button("literal")` call sites
    # elsewhere in this target (Dropdown, most of Settings, Dashboard) are
    # left as plain literals deliberately — those already resolve through
    # `LocalizedStringKey` and Xcode's build-time string extraction picks
    # them up into this same catalog automatically, with no source change
    # needed.
    #
    # No PrivacyInfo.xcprivacy here, unlike the four iOS/watchOS bundles
    # below. Privacy manifests gate uploads to App Store Connect; this app
    # ships Developer ID + notarization (plan §15) precisely because it
    # cannot be sandboxed (§14.1), and no manifest is read on that path. The
    # honest privacy surface for this target is its Info.plist usage strings
    # and the in-app privacy page §14.3 calls for.
    sources:
      - path: Sentry
      # The privileged fan helper's launchd job description, copied into
      # Sentry.app/Contents/Library/LaunchDaemons/ — the one directory
      # `SMAppService.daemon(plistName:)` looks in, by file name. It is
      # listed here rather than in the SentryFanDaemon target because it
      # describes where the *app* installs the helper from; the daemon
      # binary itself never reads it.
      #
      # This is data, not code: it is not compiled, and it must not land in
      # Resources (where XcodeGen would otherwise put a .plist by
      # extension), because SMAppService would then report `.notFound` for
      # a helper that is sitting right there in the bundle.
      - path: SentryFanDaemon/dev.malekswilam.sentry.fandaemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # The command-line bridge's launchd job description, copied into
      # Sentry.app/Contents/Library/LaunchAgents/ — the one directory
      # `SMAppService.agent(plistName:)` looks in, by file name. Same
      # arrangement as the fan daemon's plist above, one directory over
      # (Agents, not Daemons: this one runs as the user).
      #
      # THIS FILE IS THE FIX. Its absence was the bug: `AppDelegate` published
      # `NSXPCListener(machServiceName: "dev.malekswilam.sentry.xpc")` and no
      # launchd job in this project had ever declared that name, so `sentryctl`
      # and SentryMCP failed against a running, healthy app. See
      # SentryKit/MCPBridge/MCPBridgeContract.swift.
      #
      # Data, not code: not compiled, and it must not land in Resources
      # (where XcodeGen would otherwise put a .plist by extension), because
      # SMAppService would then report `.notFound` for an agent sitting right
      # there in the bundle.
      - path: SentryMCPBridge/dev.malekswilam.sentry.xpc.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: SentryKit_macOS
        embed: true
      - target: SystemMetricsKit
        embed: true
      - target: SentryWidgetExtension_macOS
        embed: true
      # The two command-line tools ship *inside* the app bundle, in
      # Contents/MacOS alongside the main executable.
      #
      # This is a fix, not a packaging preference. Both tools link
      # SentryKit.framework with `embed: false` (below), so their Mach-O
      # headers reference `@rpath/SentryKit.framework/...` and their only
      # useful rpath entry is `@executable_path/../Frameworks`. Built loose in
      # the products directory they cannot resolve that at all — running
      # `./sentry` there dies with `dyld: Library not loaded:
      # @rpath/SentryKit.framework/Versions/A/SentryKit`. Dropped into
      # Contents/MacOS, `@executable_path/../Frameworks` resolves to
      # Sentry.app/Contents/Frameworks, where SentryKit.framework already is,
      # and they run. integrations/claude-code/README.md has been telling users
      # to invoke `.../Sentry.app/Contents/MacOS/sentryctl` for a while; this is
      # what makes that path exist.
      #
      # It also makes the notarization story complete. Nested executables must
      # be signed with the same Team ID and hardened runtime as their host, and
      # a stapled ticket covers the whole bundle — so shipping them inside means
      # they are notarized and Gatekeeper-approved with the app. Shipped loose
      # they could be notarized but never *stapled* (a bare Mach-O has nowhere
      # to store a ticket), leaving them dependent on an online check.
      #
      # `codeSign: true` puts "Code Sign On Copy" on the phase, so each tool is
      # re-signed with the app's identity as it is embedded, before the outer
      # bundle is sealed — the inner-out order plan §15.2 requires.
      - target: SentryMCP
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: SentryCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The privileged fan helper. Copied into Contents/MacOS alongside the
      # two command-line tools, because that is the path
      # `dev.malekswilam.sentry.fandaemon.plist` names in its
      # `BundleProgram` key — a path relative to the app bundle, so the
      # helper travels with the app instead of pinning it to /Applications.
      #
      # `codeSign: true` is not optional here the way it is a nicety
      # elsewhere. `SMAppService.daemon` registration flatly requires the
      # daemon to be signed with the same Team ID as the app that registers
      # it, and the app must satisfy the daemon's own `SMAuthorizedClients`
      # requirement (embedded in its binary — see the target below). Both
      # are signature checks, both are made by launchd before any of our
      # code runs, and neither can be satisfied on a machine with no signing
      # identities. On such a machine — which is the machine this was
      # written on — registration fails, the app reports it on screen, and
      # every write control stays disabled. That is the intended inert
      # state, not a build failure: nothing here breaks an unsigned build.
      - target: SentryFanDaemon
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The command-line bridge. Copied into Contents/MacOS beside the two
      # tools and the fan daemon, because that is the path
      # `dev.malekswilam.sentry.xpc.plist` names in its `BundleProgram` key.
      #
      # `codeSign: true` is load-bearing here for the same reason it is for
      # SentryFanDaemon: `SMAppService.agent` registration requires the agent
      # to be signed with the same real Team ID as the app registering it, and
      # that check is made by launchd before any of our code runs. On a machine
      # with no signing identities — the machine this was written on —
      # registration fails, Settings ▸ AI Access says so verbatim, `sentryctl`
      # fails with a message naming that as the cause, and the rest of the app
      # is untouched. That is the intended inert state, not a build failure.
      - target: SentryMCPBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      # `link: true` — it was `false`, which is why Sparkle sat declared in
      # this file while `SPUStandardUpdaterController` appeared nowhere in
      # the source: unlinked, the module cannot even be imported, so the
      # dependency was decorative.
      #
      # `embed: false` is deliberate and is NOT the old dead setting carried
      # forward — Sparkle 2 ships through SPM as a `binaryTarget`
      # (a pre-built XCFramework), and Xcode embeds and signs those into the
      # app bundle automatically as part of linking them. Adding an explicit
      # "Embed Frameworks" copy phase on top fails the build outright
      # (`The file "Sparkle" couldn't be opened`), because there is no
      # build-products framework at that path to copy. Every other package
      # here (MCP, SwiftNIO) is a source target that links statically into
      # the executable and genuinely needs nothing embedded; Sparkle is the
      # one that *is* embedded, just not by us. Verify after a build with:
      #   ls "$BUILT_PRODUCTS_DIR/Sentry.app/Contents/Frameworks/Sparkle.framework"
      #
      # SIGNING NOTE — this changes the bundle's nested-code shape.
      # Sparkle.framework is not a single dylib. Verified in the 2.9.4
      # bundle this resolves to, under Versions/B/:
      #   Autoupdate              (bare helper executable)
      #   Updater.app             (the progress UI that outlives the app)
      #   XPCServices/Downloader.xpc
      #   XPCServices/Installer.xpc
      # — all of it because the updater has to outlive and relaunch the app
      # it is replacing, so it cannot live in the app's own process. Every
      # nested bundles must be signed inside-out with the same Developer ID
      # identity and hardened runtime as the app, *before* notarization;
      # `codesign --deep` does not do this correctly and Apple documents it
      # as unsupported. Signing configuration is deliberately not touched
      # here — see `docs/sparkle-release-signing.md`.
      - package: Sparkle
        product: Sparkle
        embed: false
        link: true
      - package: MCP
        product: MCP
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOCore
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOPosix
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOHTTP1
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOFoundationCompat
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry
        # The app is named Sentry; the module stays Sentry so `@testable
        # import Sentry` and every internal reference keep compiling. Bundle
        # id is unchanged on purpose — it's identity, not branding.
        PRODUCT_NAME: Sentry
        # App icon. The catalogs live under each target's existing `sources:`
        # path, so XcodeGen picks them up as resources by extension — no
        # explicit `resources:` entry needed (same mechanism as the
        # Localizable.xcstrings catalogs documented above).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: Sentry
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        # Signing is on in both configurations, but for different reasons and
        # with different identities (see `configs:` below and the
        # `DeveloperIDSigned` template). In Debug it exists so the embedded
        # widget appex carries a signature chronod will load; in Release it is
        # the whole point of the build.
        #
        # Deliberately NO App Group entitlement on the macOS side: Xcode
        # requires a provisioning profile for iOS-style `group.*` groups on
        # macOS, which neither the ad-hoc Debug setup nor a profile-free
        # Developer ID archive produces. `WidgetSnapshotStore` uses a plain
        # (non-group) suite on macOS instead — see its doc comment.
        CODE_SIGNING_ALLOWED: YES
        # Replaces the former `APP_SANDBOX: NO`, which was not a real Xcode
        # build setting and therefore did nothing — the sandbox was off only
        # because off is the default. Sentry/Sentry.entitlements now states
        # `com.apple.security.app-sandbox = false` outright, which is both the
        # mechanism the signature actually carries and the place a reader can
        # find out why (private IOReport/IOHID APIs are unreachable inside the
        # sandbox; see that file's header and plan §14.1).
        CODE_SIGN_ENTITLEMENTS: Sentry/Sentry.entitlements
      configs:
        Debug:
          # Hardened runtime turns on library validation, which rejects
          # ad-hoc-signed embedded frameworks — and in Debug every framework in
          # this bundle (SentryKit, SystemMetricsKit, the SwiftPM product
          # frameworks) is ad-hoc-signed, because there is no team to sign them
          # with. So Debug keeps hardened runtime off and the ad-hoc identity.
          #
          # That reasoning does not carry over to Release, which is why this is
          # now per-configuration rather than a flat NO: in a Developer ID
          # archive every one of those frameworks is signed by the same team as
          # the app, so library validation is satisfied and hardened runtime
          # (which notarization requires) causes no problem at all. The template
          # turns it on for Release.
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Sentry/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Sentry
        # Both authors, per `git shortlog -sne --all` — this string is what
        # Finder's "Get Info" shows and what the About pane
        # (`Sentry/Settings/Panes/AboutPane.swift`) is required to match.
        # It is duplicated, deliberately and unavoidably, in
        # `AppCredits.copyright` (SentryKit/Models/AppCredits.swift): a
        # generated Info.plist value cannot be computed from Swift, and Swift
        # cannot read this file. Change both together; `AppCreditsTests`
        # asserts the shape but cannot see this literal.
        NSHumanReadableCopyright: "Copyright © 2026 Malek Swilam & Aniketh Bandlamudi. All rights reserved."
        # ---------------------------------------------------------------
        # Version strings — REAL BUG FIXED HERE, not a tidy-up.
        #
        # XcodeGen writes CFBundleShortVersionString "1.0" and
        # CFBundleVersion "1" into a generated Info.plist unless told
        # otherwise, and it did: the shipped plist said 1.0/1 while
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION above said 0.1.0/1.
        # Harmless-looking, and fatal to updates — Sparkle compares exactly
        # these two Info.plist keys (not the build settings) against the
        # appcast's `sparkle:shortVersionString`/`sparkle:version` to decide
        # whether a candidate is newer. A build that announces itself as
        # "1.0" would consider every 0.x release in the feed older than
        # itself and silently install nothing, forever, with no error
        # anywhere. Substituting the build settings makes them the single
        # source of truth, so bumping MARKETING_VERSION for a release is
        # enough and there is no second place to forget.
        # ---------------------------------------------------------------
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ---------------------------------------------------------------
        # Sparkle (Sentry/App/UpdateController.swift).
        #
        # ⚠️ SUFeedURL IS COMPILED INTO EVERY SHIPPED BINARY AND CANNOT BE
        # CHANGED RETROACTIVELY ON COPIES ALREADY INSTALLED. ⚠️
        # An installed Sentry looks at whatever address was baked into the
        # copy the user downloaded — nothing on a server can redirect it. If
        # this address ever has to move, the *only* migration path is to
        # publish one more update through the OLD feed whose payload is a
        # build pointing at the new one, and to keep the old feed alive
        # indefinitely for anyone who skips it. Treat this string as
        # permanent. GitHub Pages for the `Sentry` repo (confirmed via
        # `git remote -v`: github.com/malekTheCoder/Sentry) is the intended
        # host — a static file, no server to run, and the same account that
        # publishes the releases.
        SUFeedURL: "https://malekthecoder.github.io/Sentry/appcast.xml"
        # ---------------------------------------------------------------
        # ⚠️ PLACEHOLDER — NOT A REAL KEY. Updates are DISABLED while this
        # is here, loudly and on screen (Settings ▸ General), never
        # silently. `UpdateFeedConfiguration.placeholderPublicKey` must
        # match this string exactly.
        #
        # Generate the pair yourself, once, and back the private half up
        # before the first release. Sparkle's tools ship inside the resolved
        # SPM artifact, so they exist only after one build; $DD below is that
        # build's -derivedDataPath:
        #
        #     "$DD"/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys
        #
        # (or `generate_keys` from the Sparkle distribution). It prints the
        # PUBLIC key — paste that here — and stores the PRIVATE key in your
        # login keychain as "Private key for signing Sparkle updates".
        # Export and back it up somewhere you control, offline:
        #
        #     "$DD"/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys -x sparkle_private_key.txt
        #
        # LOSING THE PRIVATE KEY PERMANENTLY ORPHANS EVERY INSTALL. There is
        # no revocation, no re-key, and no recovery: existing copies only
        # trust signatures from that one key, so a replacement key means
        # every user must manually download the new build. Back it up before
        # you ship, not after. Full procedure and release-time signing order
        # in `docs/sparkle-release-signing.md`.
        # ---------------------------------------------------------------
        SUPublicEDKey: "REPLACE-WITH-YOUR-SPARKLE-ED25519-PUBLIC-KEY"
        # Required for `LocationService` (`SentryKit/Services/LocationService.swift`)
        # — the honest "Location Log" feature (never "Find My," see that
        # type's doc comment). Only ever triggers a permission prompt when
        # the user explicitly enables the feature in Settings ▸ Location
        # (`LocationPane`), never at launch. `NSLocationUsageDescription` is
        # the legacy key macOS's TCC prompt still reads; both are set to the
        # same text for safety across macOS versions.
        #
        # The wording covers the Location Log and nothing else, which is
        # exactly what this build can do with location. The other macOS API
        # that would pull location into TCC — `CWInterface.ssid()` in
        # SystemMetricsKit/Collectors/NetworkCollector.swift, which trips the
        # Location Services prompt on Sonoma+ — is behind that collector's
        # `includeSSID` flag, and `AppDelegate` constructs
        # `NetworkCollector()` with the flag at its `false` default, so no
        # shipping code path reads an SSID. Naming Wi-Fi network names here
        # would therefore be an overclaim; if `includeSSID` ever becomes
        # reachable from the UI, this string has to grow a clause.
        NSLocationUsageDescription: "Sentry can periodically log this Mac's approximate location so your iPhone can show where it was last seen. This only runs while Sentry is running, and only if you turn it on in Settings."
        NSLocationWhenInUseUsageDescription: "Sentry can periodically log this Mac's approximate location so your iPhone can show where it was last seen. This only runs while Sentry is running, and only if you turn it on in Settings."
        # macOS 15 gates the local network the way iOS has for years, and this
        # app is squarely inside that gate on two counts: `LocalSyncServer`
        # (SentryKit/LocalSync/LocalSyncServer.swift) advertises
        # `_sentry._tcp` over Bonjour and accepts connections from the
        # phone/watch, and `MCPRemoteServer` (Sentry/App/MCPRemoteServer.swift)
        # binds an HTTP listener to all interfaces when Remote Access is on.
        # Mirrors the `SentryMobile` block below, which already had both keys
        # for the browsing side of the same conversation — `NSBonjourServices`
        # must list the identical service type both sides agree on
        # (`LocalSyncServer.serviceType` / `LocalSyncClient`'s browse type).
        #
        # Worth stating plainly rather than discovering later: this prompt
        # appears at launch on macOS 15+, not on first use, because
        # `AppDelegate.applicationDidFinishLaunching` starts `localSyncServer`
        # unconditionally — a deliberate choice documented at that call site
        # (an unused listener should be inert, not unreachable), but a real
        # exception to plan §14.2's "ask late, ask contextually, never at
        # launch." Adding these keys does not create the prompt; it gives the
        # prompt an honest sentence instead of a blank one. Location and
        # notifications remain strictly opt-in and are still never requested
        # at launch.
        NSLocalNetworkUsageDescription: "Sentry advertises this Mac on your local network so your iPhone and Apple Watch can find it and show its live stats over Wi-Fi, and — only if you turn on Remote Access — answers requests on the port you choose. None of this data is sent to any server."
        NSBonjourServices:
          - "_sentry._tcp"

  SentryMobile:
    type: application
    platform: iOS
    # SentryMobile/Resources/Localizable.xcstrings — same auto-detected
    # mechanism as Sentry/SentryKit_macOS above. Covers AlertRuleDisplay's
    # AlertCategory names and condition-summary phrasing; the 4 tab labels
    # (`RootTabView`'s `Label("Dashboard"/"History"/"Alerts"/"Settings",
    # systemImage:)`) are plain `LocalizedStringKey` literals already and
    # need no source change — see the Sentry target's comment above for why.
    #
    # SentryMobile/PrivacyInfo.xcprivacy is picked up from this same
    # `sources: path` by extension, like the string catalogs above — no
    # `resources:` entry needed, and it lands at the bundle root where the
    # App Store's scanner looks. Its own header comment carries the audit
    # behind every declaration in it.
    sources:
      - path: SentryMobile
    dependencies:
      - target: SentryKit_iOS
        embed: true
      - target: SentryWidgetExtension
        embed: true
      # A watchOS `application` target dependency is XcodeGen/Xcode's way of
      # embedding a modern (watchOS 9+, single-target, no legacy WatchKit
      # extension) watch app — it produces an "Embed Watch Content" copy
      # phase rather than the "Embed App Extensions" phase the two widget
      # dependencies above get, since the destination platform differs from
      # this target's own.
      - target: SentryWatch
        embed: true
      - sdk: WatchConnectivity.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.mobile
      # App icon. The catalogs live under each target's existing `sources:`
      # path, so XcodeGen picks them up as resources by extension — no
      # explicit `resources:` entry needed (same mechanism as the
      # Localizable.xcstrings catalogs documented above).
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Simulator builds don't need a signing team, but they DO need the
      # entitlements actually embedded (codesign runs even for the "Sign to
      # Run Locally" identity Xcode uses on Simulator) for the App Group
      # container behind `WidgetSnapshotStore` to work — that's real, not
      # just cosmetic, unlike the project-wide CODE_SIGNING_ALLOWED: NO
      # default in the `base` settings block above, which fully suppresses
      # signing (and therefore entitlement embedding) for the targets that
      # never asked for one. See `WidgetSnapshotStore.swift`'s doc comment
      # for what happens if this ever regresses.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: SentryMobile/SentryMobile.entitlements
      # Device deployment: personal-team automatic signing. Simulator
      # builds ignore this; device builds need real profiles for the app +
      # every embedded target (see the same block on the widget/watch
      # targets). The Mac app deliberately stays ad-hoc.
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: SentryMobile/Info.plist
      properties:
        CFBundleDisplayName: Sentry
        # Same string as the Mac app's — the two apps have the same authors,
        # and App Store Connect reads this key for the iOS listing's
        # copyright line. Kept in sync by hand with the macOS target above
        # and with `AppCredits.copyright`.
        NSHumanReadableCopyright: "Copyright © 2026 Malek Swilam & Aniketh Bandlamudi. All rights reserved."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Registers the `sentry` scheme that `RemotePairing` generates QR
        # links with and `SentryMobileApp.onOpenURL` handles. Without this
        # registration the Camera app never offers "Open in Sentry" and the
        # entire scan-to-pair flow is unreachable — RemotePairing's doc
        # comment had claimed the registration existed, but no plist carried
        # it. Registered here, not by editing SentryMobile/Info.plist
        # directly: that file is GENERATED from this block on every
        # `xcodegen generate`, so a direct edit silently evaporates.
        CFBundleURLTypes:
          - CFBundleURLName: dev.malekswilam.sentry.pairing
            CFBundleURLRole: Editor
            CFBundleURLSchemes:
              - sentry
        # Required for `LocalSyncClient` (`SentryKit/LocalSync/LocalSyncClient.swift`)
        # to browse for and connect to `LocalSyncServer` over Bonjour/
        # `Network.framework` — iOS gates both local-network `NWBrowser`
        # discovery and any Bonjour service lookup behind these two entries,
        # prompting the user the first time either is used. See
        # `StatsTransport.swift`'s doc comment for why this transport exists
        # at all (CloudKit is blocked on Apple Developer Program enrollment;
        # this one isn't).
        #
        # The string names control as well as viewing, which the original
        # ("...to show live data from your Mac...") did not. That connection
        # has been bidirectional since `LocalSyncClient.send(command:)`
        # landed: the sleep card and the Siri intents push a `ControlCommand`
        # back up it to hold the Mac awake or let it sleep. Only the paired
        # TLS-PSK listener actually accepts those commands, but it is
        # reachable over the LAN too, so "control travels over your local
        # network" is a true sentence and belongs in the prompt the user
        # answers rather than only in a doc comment.
        NSLocalNetworkUsageDescription: "Sentry uses your local network to find your Mac and show its live stats when you're on the same Wi-Fi, and to send it the keep-awake and sleep commands you tap or ask Siri for. None of this data is sent to any server."
        NSBonjourServices:
          - "_sentry._tcp"
        # See the project-wide `settings.base` comment: without these two
        # substitutions XcodeGen writes "1.0"/"1" and this app uploads as a
        # different version than the one tagged, with the embedded watch app
        # and both appexes silently agreeing on the same wrong numbers.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ---------------------------------------------------------------
        # Export compliance (US EAR Category 5 Part 2 / Apple's App Store
        # Connect encryption questionnaire).
        #
        # Declared in the plist rather than answered by hand in App Store
        # Connect because the hand-answered version has to be re-answered
        # for *every* uploaded build, and a build sits in "Missing
        # Compliance" — not submittable, not visible to TestFlight external
        # testers — until someone remembers. The key answers it once, at
        # build time, for every build produced from this spec.
        #
        # `false` — this app uses encryption, but only encryption that is
        # exempt because it belongs to the operating system rather than to
        # us. The evidence, in one place so a future reader can re-check it
        # rather than trust it:
        #
        #   * The only encrypted channel is the remote (off-LAN) sync path
        #     in `SyncSecurity.tlsOptions(pairingCode:)`
        #     (SentryKit/LocalSync/SyncSecurity.swift). It is
        #     `NWProtocolTLS.Options` — Apple's TLS stack, the same one
        #     under URLSession's HTTPS — pinned to TLS 1.2 with the
        #     standard, published IANA ciphersuite
        #     TLS_PSK_WITH_AES_128_GCM_SHA256, keyed through
        #     `sec_protocol_options_add_pre_shared_key`. Every one of those
        #     symbols is Security.framework/Network.framework.
        #   * The pairing code becomes key material via CryptoKit's
        #     `SHA256.hash(data:)` (SyncSecurity.swift:95). SHA-256 is a
        #     published standard hash, not encryption, and CryptoKit is
        #     again the OS.
        #   * The Bonjour/LAN path is deliberately plaintext (see
        #     `LocalSyncServer`'s doc comment), so it contributes nothing.
        #   * There is no bundled crypto library, no proprietary or
        #     unpublished algorithm, and nothing in the one third-party
        #     package that reaches this bundle (GRDB) that changes that.
        #
        # That is exactly Apple's stated exemption for encryption built into
        # the operating system:
        # https://developer.apple.com/documentation/security/complying-with-encryption-export-regulations
        #
        # ⚠️ This key is a legal declaration made by the app's owner, not a
        # build setting. It is set here because the audit above supports it
        # (docs/appstore-review-readiness.md, "Encryption / export
        # compliance"), but the owner should read that section and satisfy
        # themselves before the first upload. If a future change ever adds a
        # crypto implementation of our own — a bundled library, a custom
        # cipher, anything not reached through an Apple framework — this
        # must be revisited, and France/annual-self-classification
        # obligations may attach.
        # ---------------------------------------------------------------
        ITSAppUsesNonExemptEncryption: false

  SentryWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      # Both widget targets generate an Info plist into this same directory
      # (Info.plist for iOS, Info-macOS.plist for macOS); excluded here so
      # neither target bundles the other's plist as a stray resource —
      # embeddedBinaryValidationUtility rejects an appex containing a plist
      # whose CFBundleIdentifier isn't prefixed by the parent app's.
      #
      # SentryWidget/PrivacyInfo.xcprivacy is NOT excluded here — this is
      # the target that needs it. `SentryWidgetExtension_macOS` below
      # excludes it instead; see the comment there.
      #
      # SentryWidget/Resources/Localizable.xcstrings is auto-detected from
      # this path for BOTH widget extension targets (iOS here, macOS below)
      # — a widget bundle resolves strings against its own catalog, not its
      # host app's, so without this file every widget label stayed English
      # in every locale regardless of what the apps' catalogs said.
      - path: SentryWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: SentryKit_iOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.mobile.widget
      PRODUCT_NAME: SentryWidget
      # See the matching comment on the `SentryMobile` target above — same
      # reasoning, same App Group, same requirement that entitlements are
      # actually embedded even for an unsigned-by-default project.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: SentryWidget/SentryWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: SentryWidget/Info.plist
      properties:
        CFBundleDisplayName: Sentry Widget
        # App Store Connect requires an appex's version strings to match the
        # containing app's exactly — see the project-wide `settings.base`
        # comment for how all four iOS/watchOS bundles came to agree on the
        # wrong pair of numbers.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SentryWidgetExtension_macOS:
    type: app-extension
    platform: macOS
    # Embedded in Sentry.app/Contents/PlugIns. An appex is nested code with its
    # own signature, and notarization checks hardened runtime on it separately
    # from the app — a widget without it fails the whole submission.
    templates:
      - DeveloperIDSigned
    sources:
      # Same Info.plist exclusion as SentryWidgetExtension above, plus the
      # privacy manifest: it is written for the iOS extension specifically
      # (App Group suite, iOS entitlements, the embedded SentryKit_iOS
      # binary), and this macOS appex ships inside a Developer ID app that
      # never passes through App Store Connect's manifest check. Copying a
      # manifest whose UserDefaults reasons don't describe this bundle —
      # `WidgetSnapshotStore` uses the plain `macSuiteIdentifier` suite here,
      # not an App Group — would be a false declaration for no benefit.
      - path: SentryWidget
        excludes:
          - "Info*.plist"
          - "PrivacyInfo.xcprivacy"
    dependencies:
      - target: SentryKit_macOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.widget
        PRODUCT_NAME: SentryWidget
        # No entitlements file in either configuration — same provisioning
        # constraint as the Sentry app target above; the store's macOS suite
        # needs none.
        CODE_SIGNING_ALLOWED: YES
      configs:
        Debug:
          # Ad-hoc, so chronod will load the widget from a locally built app.
          # Release swaps this for the Developer ID identity via the template.
          CODE_SIGN_IDENTITY: "-"
    info:
      # Its own generated plist path — the iOS extension's `info:` block
      # already generates SentryWidget/Info.plist, and two targets writing
      # one path would race on content.
      path: SentryWidget/Info-macOS.plist
      properties:
        CFBundleDisplayName: Sentry Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SentryWatch:
    type: application
    platform: watchOS
    # SentryWatch/PrivacyInfo.xcprivacy is auto-detected from this path, the
    # same way SentryMobile's is. Its declarations are deliberately shorter
    # than the phone's because `SentryKit_watchOS` above compiles an
    # enumerated subset rather than the whole framework — that manifest's
    # header spells out which required-reason call sites are consequently
    # absent here, and names the exact file list it depends on.
    #
    # SentryWatch/Resources/Localizable.xcstrings rides along from this
    # path too (same auto-detected-by-extension mechanism as the Sentry/
    # SentryKit/SentryMobile catalogs above). Before it existed, every
    # `Text("literal")` and `String(localized:)` in this target resolved
    # against no catalog at all — the watch app was unlocalizable by
    # construction, not by choice. English keys only; translations are a
    # deliberate non-goal for now (see docs/l10n-coverage-audit.md).
    sources:
      - path: SentryWatch
    dependencies:
      - target: SentryKit_watchOS
        embed: true
      - target: SentryWatchWidgetExtension
        embed: true
      - sdk: WatchConnectivity.framework
    settings:
      # Must extend the iPhone app's identifier followed by "." — iOS
      # refuses to install the phone app otherwise (this was
      # dev.malekswilam.sentry.watch, which blocked every install of
      # SentryMobile with the watch embedded).
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.mobile.watch
      # Without this the watch app crashes on every launch, 100% of the time,
      # with `Library not loaded: @rpath/SentryKit.framework/SentryKit`.
      #
      # SentryKit_watchOS is embedded (see `dependencies:` above) and lands in
      # SentryWatch.app/Frameworks/. But this target's only rpath was
      # `@executable_path`, which resolves to the bundle root — so dyld looked
      # for SentryWatch.app/SentryKit.framework, one directory too high, and
      # aborted before `main` ever ran.
      #
      # Why it went unnoticed: the bug is invisible to every check this project
      # was making. It builds cleanly, links cleanly, and the unit suite is
      # macOS-hosted so it never loads this binary. It only appears when the
      # app is actually launched. The sibling widget extension was fine the
      # whole time — Xcode's default rpaths for an *app extension* already
      # include `@executable_path/../../Frameworks`, and SentryMobile gets
      # `@executable_path/Frameworks` incidentally from its SwiftPM package
      # dependencies. This target has neither: no SwiftPM deps, and it is an
      # app rather than an extension, so nothing supplied it.
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      # App icon. The catalogs live under each target's existing `sources:`
      # path, so XcodeGen picks them up as resources by extension — no
      # explicit `resources:` entry needed (same mechanism as the
      # Localizable.xcstrings catalogs documented above).
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # The App Group behind `WatchRelayStore` needs its entitlement file
      # actually embedded even under Simulator's "Sign to Run Locally"
      # identity, matching `SentryMobile`'s identical reasoning above.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: SentryWatch/SentryWatch.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: SentryWatch/Info.plist
      properties:
        CFBundleDisplayName: Sentry
        WKApplication: true
        # Pairs this watch app with `SentryMobile` — required so watchOS
        # knows which iPhone app installs this alongside it, and so
        # `WCSession.isWatchAppInstalled` (read from `WatchRelayManager` on
        # the phone side) resolves correctly instead of always reporting
        # `false`.
        WKCompanionAppBundleIdentifier: dev.malekswilam.sentry.mobile
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # An embedded watch app is the strictest case of the version-match
        # rule App Store Connect enforces: its CFBundleShortVersionString and
        # CFBundleVersion must equal the containing iOS app's, or the upload
        # is rejected outright. See the project-wide `settings.base` comment.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

  SentryWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      # SentryWatchWidget/PrivacyInfo.xcprivacy rides along from this path;
      # only the generated Info.plist is excluded, for the same
      # embeddedBinaryValidationUtility reason as the iOS widget above.
      # SentryWatchWidget/Resources/Localizable.xcstrings rides along the
      # same way — the complication's own catalog, for the same
      # bundle-resolves-its-own-strings reason as the iOS widget above.
      - path: SentryWatchWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: SentryKit_watchOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      # Extends the watch app's identifier, which itself extends the phone
      # app's — the full chain iOS/watchOS embedding requires.
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.mobile.watch.widget
      PRODUCT_NAME: SentryWatchWidget
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: SentryWatchWidget/SentryWatchWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: SentryWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Sentry Complication
        # Same version-match rule as the iOS widget above — and this appex is
        # nested two levels deep (iPhone app ▸ watch app ▸ complication), so
        # it is the easiest of the four to forget.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SentryMCP:
    type: tool
    platform: macOS
    # Copied into Sentry.app/Contents/MacOS by the Sentry target — nested
    # code, so it needs the same identity, hardened runtime and timestamp as
    # its host. The Copy Files phase re-signs it on the way in
    # (`codeSign: true` there); these settings are what the tool is built and
    # signed with beforehand, so `codesign -dv --strict` is clean either way.
    templates:
      - DeveloperIDSigned
    sources:
      - path: SentryMCP
    dependencies:
      - target: SentryKit_macOS
        embed: false
      - package: MCP
        product: MCP
        embed: false
        link: true
    # `base:` rather than the flat form — see the note on SystemMetricsKit above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.mcp

  SentryCLI:
    type: tool
    platform: macOS
    # Same as SentryMCP above: copied into Sentry.app/Contents/MacOS as
    # `sentryctl`, so it is notarized nested code rather than a loose binary.
    templates:
      - DeveloperIDSigned
    sources:
      - path: SentryCLI
    dependencies:
      - target: SentryKit_macOS
        embed: false
    # `base:` rather than the flat form — see the note on SystemMetricsKit above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.cli
        # EXECUTABLE_NAME (not PRODUCT_NAME) renames just the output binary to
        # "sentry" — PRODUCT_NAME stays "SentryCLI" so the module name it
        # implies doesn't collide with the "Sentry" app target's own module
        # on a case-insensitive filesystem (this collided as "cannot load
        # module 'sentry' as 'Sentry'" when PRODUCT_NAME was set directly).
        EXECUTABLE_NAME: sentryctl

  # The privileged fan helper (fan-control plan Phase 3). Runs as root,
  # launched on demand by launchd from
  # Sentry.app/Contents/Library/LaunchDaemons/, and is the only thing in
  # this project that can write an SMC key.
  #
  # NOTE THE SOURCE LIST, which is the security-relevant part of this
  # target. It compiles four files of its own plus the six files in
  # SentryKit/FanDaemon/, and it links **no framework of ours at all** —
  # not SentryKit, not SystemMetricsKit. That is the same technique
  # SentryKit_watchOS uses above (list the files, not the directory), and
  # here the motive is auditability rather than platform support: a root
  # process whose entire compile surface is Foundation + IOKit + Security +
  # ten files is a tractable thing to review, whereas one that dragged in
  # GRDB, the MCP SDK and SwiftNIO would not be. It also means the daemon
  # has no @rpath dependency on the app's embedded frameworks and runs
  # correctly from Contents/MacOS with nothing else loaded.
  #
  # The duplication this costs (`SMCFanWriter` re-implements SMCFanBridge's
  # protocol layer) buys a property stated in that file's header and worth
  # restating: no binary inside Sentry.app can write to the SMC. Only this
  # one can.
  SentryFanDaemon:
    type: tool
    platform: macOS
    # Copied into Sentry.app/Contents/MacOS — notarized nested code, same as
    # SentryMCP and SentryCLI, and additionally subject to the Team ID
    # match SMAppService enforces.
    templates:
      - DeveloperIDSigned
    sources:
      - path: SentryFanDaemon
        excludes:
          # The launchd job description belongs to the app bundle, not to
          # this binary (the Sentry target copies it into
          # Contents/Library/LaunchDaemons); the generated Info.plist is
          # consumed via CREATE_INFOPLIST_SECTION_IN_BINARY below, not
          # bundled. A `tool` target has no resources phase for either of
          # them to land in anyway.
          - "*.plist"
      # The pure decision layer — clamping, the fail-safe state machine, the
      # peer gate, and the XPC contract. Shared with SentryKit by
      # compilation rather than by linking; see this target's header.
      - path: SentryKit/FanDaemon
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.fandaemon
        # A command-line tool has no Info.plist file in a bundle, so the
        # plist is embedded as a __TEXT,__info_plist section instead. That
        # is where launchd and SMAppService look for SMAuthorizedClients on
        # a bare Mach-O.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    info:
      path: SentryFanDaemon/Info.plist
      properties:
        CFBundleIdentifier: dev.malekswilam.sentry.fandaemon
        # ---------------------------------------------------------------
        # THE FIRST HALF OF PEER VERIFICATION (safety requirement 3).
        #
        # launchd refuses XPC connections from clients that do not satisfy
        # this designated requirement, before any of the daemon's own code
        # runs. The second half is FanDaemonPeerGate, which re-checks the
        # same requirement inside the daemon process — because
        # authorization that exists only in a configuration file is
        # authorization that a configuration mistake removes silently.
        #
        # ⚠️ THIS STRING IS DUPLICATED IN
        # `SentryKit/FanDaemon/FanDaemonPeerGate.swift` AS
        # `clientRequirement`, AND THE TWO MUST STAY IDENTICAL. They cannot
        # share a constant: launchd reads this plist and cannot read Swift.
        # `FanDaemonPeerGateTests` asserts the exact expected text so a
        # change on the Swift side fails a test that names this file.
        #
        # Each clause is load-bearing — see FanDaemonPeerGate's doc comment
        # for what each one prevents. The Team ID must match
        # DEVELOPMENT_TEAM in the DeveloperIDSigned template above.
        # ---------------------------------------------------------------
        SMAuthorizedClients:
          - 'identifier "dev.malekswilam.sentry" and anchor apple generic and certificate leaf[subject.OU] = "H7T2D2GL7U"'

  # The command-line bridge — the on-demand LaunchAgent that owns the Mach
  # service `sentryctl` and SentryMCP dial, and hands them a direct connection
  # to a running Sentry.
  #
  # THIS TARGET IS THE FIX. `AppDelegate` used to call
  # `NSXPCListener(machServiceName: "dev.malekswilam.sentry.xpc")` on a name
  # no launchd job declared, and only the process launchd starts as the job
  # may vend that job's service — so the app's listener could never receive a
  # connection and both tools failed against a healthy app.
  # SentryKit/MCPBridge/MCPBridgeContract.swift records the measurement that
  # proved this and why a broker, rather than a relay or a socket, is the
  # shape that follows from it.
  #
  # NOTE THE SOURCE LIST, same as SentryFanDaemon's and for the same reason.
  # It compiles two files of its own plus the five in SentryKit/MCPBridge/,
  # and it links **no framework of ours** — not SentryKit, not
  # SystemMetricsKit. Sharing by compilation rather than by linking keeps this
  # binary's whole surface to Foundation + Security + seven files, which is a
  # tractable thing to review for a process that brokers access to every
  # metric Sentry can report. It also means the agent has no @rpath dependency
  # on the app's embedded frameworks and runs from Contents/MacOS with nothing
  # else loaded — the same trap `SentryCLI`/`SentryMCP` had to be moved
  # inside the bundle to escape.
  #
  # Unlike the fan daemon, this one runs as the logged-in user. It writes no
  # hardware register, opens no database, and makes no network connection.
  SentryMCPBridge:
    type: tool
    platform: macOS
    templates:
      - DeveloperIDSigned
    sources:
      - path: SentryMCPBridge
        excludes:
          # The launchd job description belongs to the app bundle, not to this
          # binary (the Sentry target copies it into
          # Contents/Library/LaunchAgents); the generated Info.plist is
          # consumed via CREATE_INFOPLIST_SECTION_IN_BINARY below, not bundled.
          - "*.plist"
      # The naming, the wire contract, the peer gate, and the Security-
      # framework evaluator. Shared with SentryKit by compilation; see this
      # target's header.
      - path: SentryKit/MCPBridge
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.xpcbridge
        # A command-line tool has no Info.plist file in a bundle, so the plist
        # is embedded as a __TEXT,__info_plist section instead. That is where
        # launchd and SMAppService look for SMAuthorizedClients on a bare
        # Mach-O.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    info:
      path: SentryMCPBridge/Info.plist
      properties:
        CFBundleIdentifier: dev.malekswilam.sentry.xpcbridge
        # ---------------------------------------------------------------
        # Deliberately the LOOSER of the two requirements — the one in
        # `MCPBridgePeerGate.consumerRequirement`, not the publisher one.
        #
        # This agent's clients include `sentryctl` and `SentryMCP`, bare
        # Mach-O tools whose signing identifiers codesign derives from the
        # file name plus a hash of the signing identity (verified on a real
        # build: `sentry-55554944088f6f87…`). No `identifier` clause can
        # name them stably, so pinning one here would lock out the two
        # binaries this feature exists to serve — and only on a properly
        # signed build, i.e. nowhere it could be caught first.
        #
        # ⚠️ DUPLICATED IN `SentryKit/MCPBridge/MCPBridgePeerGate.swift` AS
        # `consumerRequirement`, AND THE TWO MUST STAY IDENTICAL. They cannot
        # share a constant: launchd reads this plist and cannot read Swift.
        # `MCPBridgePeerGateTests` asserts the exact expected text so a
        # change on the Swift side fails a test that names this file.
        #
        # The publisher/consumer distinction is drawn inside BridgeService,
        # where it is certain to be enforced. See SentryMCPBridge/Info.plist
        # for why this key's behaviour for agents is itself unverified.
        # ---------------------------------------------------------------
        SMAuthorizedClients:
          - 'anchor apple generic and certificate leaf[subject.OU] = "H7T2D2GL7U"'

  SentryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SentryTests
    dependencies:
      - target: Sentry
      - target: SentryKit_macOS
      - target: SystemMetricsKit
      # For APIKeyValidatorTests, which constructs real MCP-SDK HTTPRequest/
      # HTTPValidationContext values — SentryKit_macOS links MCP too, but
      # this target imports it directly rather than relying on transitive
      # module visibility through the framework.
      - package: MCP
        product: MCP
        embed: false
        link: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.sentry.tests
      # XcodeGen derives TEST_HOST from the target name, not from the
      # PRODUCT_NAME override that renames the app to Sentry — so it must be
      # spelled out or `xcodebuild test` can't find the host binary.
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sentry.app/Contents/MacOS/Sentry"
      BUNDLE_LOADER: "$(TEST_HOST)"
      # Required since the switch to automatic signing: a signed test
      # bundle must carry an Info.plist, and this target has no
      # hand-written one — generate it, same as the embedded frameworks.
      GENERATE_INFOPLIST_FILE: YES

schemes:
  Sentry:
    build:
      targets:
        Sentry: all
        SentryMCP: all
        SentryCLI: all
        SentryFanDaemon: all
        SentryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SentryTests
