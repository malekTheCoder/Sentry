name: MacStat
options:
  bundleIdPrefix: dev.malekswilam.macstat
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    # watchOS 10 is the first release where accessoryCorner-style
    # WidgetKit complications and the modern (no legacy WatchKit
    # extension) single-target watch app shape are both available —
    # MacStatWatch/MacStatWatchWidget below rely on both.
    watchOS: "10.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# The project-wide floor, unchanged and deliberately permissive: a checkout of
# this repo on a Mac with zero signing identities must build and must run its
# tests. `run.sh` and every `xcodebuild ... test` invocation depend on that, and
# this machine currently has exactly zero identities (`security find-identity -v
# -p codesigning` → "0 valid identities found"), so it is not a hypothetical.
#
# These values are a floor, not a policy. Targets that genuinely need a
# signature opt back in individually (the Mac app and its appex, so chronod will
# load the widget; the iOS/watchOS targets, so their App Group entitlement is
# actually embedded), and the Release-configuration strictness that notarization
# demands lives in the `DeveloperIDSigned` target template below rather than
# here — this block is shared with the iOS and watchOS targets, for which
# "Developer ID Application" is not a valid identity at all.
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

# Applied to every macOS target whose product ends up inside (or alongside) the
# notarized Sentry.app: the app, the two embedded frameworks, the widget appex,
# and the two command-line tools. Everything it sets is scoped to Release, so
# adopting the template changes nothing about a Debug build.
#
# Notarization is non-negotiable about all four of these:
#
#   * A real `Developer ID Application` identity, from an enrolled Apple
#     Developer Program team. Ad-hoc ("-") signatures are rejected outright.
#   * Hardened runtime on every Mach-O in the bundle — not just the main
#     executable. A single nested binary without it fails the submission.
#   * A secure timestamp. `--timestamp` is passed explicitly rather than relying
#     on xcodebuild's archive-time default, because that default differs between
#     `build` and `archive` and a missing timestamp is a submission failure with
#     an unhelpful message.
#   * No `com.apple.security.get-task-allow`. Xcode injects it through
#     CODE_SIGN_INJECT_BASE_ENTITLEMENTS so debuggers can attach; turning the
#     injection off for Release is what guarantees it cannot ride along into an
#     archive. (It stays on for Debug, where attaching a debugger is the point.)
#
# CODE_SIGNING_REQUIRED: YES is the important negative test here. Without it, a
# Release build on a machine with no Developer ID certificate would quietly fall
# back to producing an unsigned bundle and only fail much later, at
# `notarytool submit`. With it, `xcodebuild archive` fails immediately and says
# which identity it could not find.
targetTemplates:
  DeveloperIDSigned:
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          DEVELOPMENT_TEAM: H7T2D2GL7U
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.0
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
  # For MCPRemoteServer (MacStat/App/MCPRemoteServer.swift) — the TCP+HTTP/1.1
  # framing layer under the MCP SDK's framework-agnostic HTTPRequest/
  # HTTPResponse types, which ship no socket listener of their own. Standard
  # SSWG-maintained choice rather than a hand-rolled HTTP parser over
  # NWListener, given this is a security-relevant surface (see
  # MCPRemoteServer's doc comment).
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0

targets:
  SystemMetricsKit:
    type: framework
    platform: macOS
    # Embedded in Sentry.app/Contents/Frameworks, so it is nested code the
    # notary service inspects in its own right — see the template's comment.
    templates:
      - DeveloperIDSigned
    sources:
      - path: SystemMetricsKit
    dependencies:
      - target: MacStatKit_macOS
        embed: false
    # Spelled out as `base:` rather than the flat `settings: {KEY: value}` form
    # every other target uses. That is not style: a target that adopts a
    # template carrying `settings.configs` (as this one does, above) silently
    # loses its flat settings during the merge — PRODUCT_NAME, bundle id and all
    # — and the failure surfaces much later as "unable to resolve module
    # dependency" from whatever imports the misnamed framework. Same reason for
    # the identical shape on MacStatKit_macOS, MacStatMCP and MacStatCLI below.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.systemmetricskit
        # Frameworks embedded into an .app must carry an Info.plist — Xcode
        # validates this at the embed step and fails the build without it.
        # Matches the equivalent setting on MacStatKit_iOS below.
        GENERATE_INFOPLIST_FILE: YES

  MacStatKit_macOS:
    type: framework
    platform: macOS
    # Embedded in Sentry.app/Contents/Frameworks — same reasoning as
    # SystemMetricsKit above. The iOS and watchOS variants of this target
    # deliberately do NOT adopt the template: "Developer ID Application" is a
    # Mac-only identity.
    templates:
      - DeveloperIDSigned
    # MacStatKit/Resources/Localizable.xcstrings (String Catalog, source
    # language en) lives under this same `sources: path` and is auto-detected
    # by XcodeGen as a resource (not compiled Swift) purely from its
    # extension — no separate `resources:` entry needed. Holds the shared
    # vocabulary used by both apps: MetricID.shortLabel/MetricModule
    # .displayName, HistoryRange.label/accessibilityLabel, MenuBarLayout's
    # DisplayMode/SeparatorStyle.displayName, MCPTool.displayName/
    # toolDescription/riskLabel. See MacStat/Resources/Localizable.xcstrings
    # and MacStatMobile/Resources/Localizable.xcstrings for the per-app
    # catalogs (Dropdown/Settings/Dashboard-window strings; iOS Alerts-tab
    # strings) — kept separate per target rather than one shared catalog so
    # each app only ships the strings it actually uses.
    sources:
      - path: MacStatKit
    dependencies:
      - package: GRDB
      # MacStatKit/MCP/ (MCPToolCatalog, ResourceCatalog) is #if os(macOS)-
      # gated — see those files' doc comments for why the tool/resource
      # dispatch logic shared by both MCP transports (stdio MacStatMCP, and
      # the in-app remote MCPRemoteServer) lives here rather than in the
      # MacStatMCP executable target alone. Not added to MacStatKit_iOS
      # below: that target compiles the same source directory, but the
      # entire `import MCP` + implementation sits behind the same macOS
      # guard, so iOS never needs this package to resolve.
      - package: MCP
        product: MCP
        embed: false
        link: true
    # `base:` rather than the flat form — see the note on SystemMetricsKit above
    # for why adopting a template forces this shape.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.kit
        PRODUCT_NAME: MacStatKit
        PRODUCT_MODULE_NAME: MacStatKit
        # See the note on SystemMetricsKit above — embedded frameworks need an
        # Info.plist or the MacStat app target fails at the embed step.
        GENERATE_INFOPLIST_FILE: YES

  MacStatKit_iOS:
    type: framework
    platform: iOS
    sources:
      - path: MacStatKit
    dependencies:
      - package: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.kit
      PRODUCT_NAME: MacStatKit
      PRODUCT_MODULE_NAME: MacStatKit
      GENERATE_INFOPLIST_FILE: YES

  MacStatKit_watchOS:
    type: framework
    platform: watchOS
    # Deliberately NOT `- path: MacStatKit` (the whole directory, the way
    # MacStatKit_macOS/MacStatKit_iOS above do it) — most of MacStatKit is
    # macOS-only IOKit/XPC/MCP code or depends on GRDB, neither of which the
    # Watch side of this feature needs at all. MacStatWatch and
    # MacStatWatchWidgetExtension only ever need the relay payload type
    # (`WatchRelaySnapshot`/`WatchRelayStore`, `MacStatKit/Watch/`) and the
    # freshness-labeling helpers (`Freshness`/`FreshnessBadge`,
    # `MacStatKit/Sync/`) — both already pure Foundation/SwiftUI with no
    # platform-specific import, so listing exactly these three files keeps
    # this target's compile surface (and its risk of picking up something
    # watchOS can't build) as small as the feature actually requires.
    sources:
      - path: MacStatKit/Watch
      - path: MacStatKit/Sync/Freshness.swift
      - path: MacStatKit/Sync/FreshnessBadge.swift
      # Added for the Watch Siri intents (MacStatWatch/Intents/
      # MacStatWatchIntents.swift): ControlCommand/ControlStatus, so the
      # watch constructs and decodes the real types rather than duplicating
      # them. Despite its CloudKit-flavored header comment, SyncRecords.swift
      # imports only Foundation, so it builds on watchOS unchanged.
      - path: MacStatKit/Sync/SyncRecords.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.kit.watch
      PRODUCT_NAME: MacStatKit
      PRODUCT_MODULE_NAME: MacStatKit
      GENERATE_INFOPLIST_FILE: YES

  MacStat:
    type: application
    platform: macOS
    templates:
      - DeveloperIDSigned
    # MacStat/Resources/Localizable.xcstrings — same auto-detected-by-
    # extension mechanism as MacStatKit_macOS above. Covers this target's own
    # display strings (Settings sidebar pane titles, Dashboard's
    # TimeRangePicker, AlertsPane's condition/duration/unit formatting, the
    # MCP tool-confirmation NSAlert, window titles). SwiftUI `Text("literal")`
    # / `Label("literal", systemImage:)` / `Button("literal")` call sites
    # elsewhere in this target (Dropdown, most of Settings, Dashboard) are
    # left as plain literals deliberately — those already resolve through
    # `LocalizedStringKey` and Xcode's build-time string extraction picks
    # them up into this same catalog automatically, with no source change
    # needed.
    sources:
      - path: MacStat
    dependencies:
      - target: MacStatKit_macOS
        embed: true
      - target: SystemMetricsKit
        embed: true
      - target: MacStatWidgetExtension_macOS
        embed: true
      # The two command-line tools ship *inside* the app bundle, in
      # Contents/MacOS alongside the main executable.
      #
      # This is a fix, not a packaging preference. Both tools link
      # MacStatKit.framework with `embed: false` (below), so their Mach-O
      # headers reference `@rpath/MacStatKit.framework/...` and their only
      # useful rpath entry is `@executable_path/../Frameworks`. Built loose in
      # the products directory they cannot resolve that at all — running
      # `./macstat` there dies with `dyld: Library not loaded:
      # @rpath/MacStatKit.framework/Versions/A/MacStatKit`. Dropped into
      # Contents/MacOS, `@executable_path/../Frameworks` resolves to
      # Sentry.app/Contents/Frameworks, where MacStatKit.framework already is,
      # and they run. integrations/claude-code/README.md has been telling users
      # to invoke `.../Sentry.app/Contents/MacOS/macstat` for a while; this is
      # what makes that path exist.
      #
      # It also makes the notarization story complete. Nested executables must
      # be signed with the same Team ID and hardened runtime as their host, and
      # a stapled ticket covers the whole bundle — so shipping them inside means
      # they are notarized and Gatekeeper-approved with the app. Shipped loose
      # they could be notarized but never *stapled* (a bare Mach-O has nowhere
      # to store a ticket), leaving them dependent on an online check.
      #
      # `codeSign: true` puts "Code Sign On Copy" on the phase, so each tool is
      # re-signed with the app's identity as it is embedded, before the outer
      # bundle is sealed — the inner-out order plan §15.2 requires.
      - target: MacStatMCP
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: MacStatCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: Sparkle
        embed: false
        link: false
      - package: MCP
        product: MCP
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOCore
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOPosix
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOHTTP1
        embed: false
        link: true
      - package: SwiftNIO
        product: NIOFoundationCompat
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat
        # The app is named Sentry; the module stays MacStat so `@testable
        # import MacStat` and every internal reference keep compiling. Bundle
        # id is unchanged on purpose — it's identity, not branding.
        PRODUCT_NAME: Sentry
        PRODUCT_MODULE_NAME: MacStat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signing is on in both configurations, but for different reasons and
        # with different identities (see `configs:` below and the
        # `DeveloperIDSigned` template). In Debug it exists so the embedded
        # widget appex carries a signature chronod will load; in Release it is
        # the whole point of the build.
        #
        # Deliberately NO App Group entitlement on the macOS side: Xcode
        # requires a provisioning profile for iOS-style `group.*` groups on
        # macOS, which neither the ad-hoc Debug setup nor a profile-free
        # Developer ID archive produces. `WidgetSnapshotStore` uses a plain
        # (non-group) suite on macOS instead — see its doc comment.
        CODE_SIGNING_ALLOWED: YES
        # Replaces the former `APP_SANDBOX: NO`, which was not a real Xcode
        # build setting and therefore did nothing — the sandbox was off only
        # because off is the default. MacStat/MacStat.entitlements now states
        # `com.apple.security.app-sandbox = false` outright, which is both the
        # mechanism the signature actually carries and the place a reader can
        # find out why (private IOReport/IOHID APIs are unreachable inside the
        # sandbox; see that file's header and plan §14.1).
        CODE_SIGN_ENTITLEMENTS: MacStat/MacStat.entitlements
      configs:
        Debug:
          # Hardened runtime turns on library validation, which rejects
          # ad-hoc-signed embedded frameworks — and in Debug every framework in
          # this bundle (MacStatKit, SystemMetricsKit, the SwiftPM product
          # frameworks) is ad-hoc-signed, because there is no team to sign them
          # with. So Debug keeps hardened runtime off and the ad-hoc identity.
          #
          # That reasoning does not carry over to Release, which is why this is
          # now per-configuration rather than a flat NO: in a Developer ID
          # archive every one of those frameworks is signed by the same team as
          # the app, so library validation is satisfied and hardened runtime
          # (which notarization requires) causes no problem at all. The template
          # turns it on for Release.
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGN_IDENTITY: "-"
    info:
      path: MacStat/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Sentry
        NSHumanReadableCopyright: "Malek Swilam"
        # Required for `LocationService` (`MacStatKit/Services/LocationService.swift`)
        # — the honest "Location Log" feature (never "Find My," see that
        # type's doc comment). Only ever triggers a permission prompt when
        # the user explicitly enables the feature in Settings ▸ Location
        # (`LocationPane`), never at launch. `NSLocationUsageDescription` is
        # the legacy key macOS's TCC prompt still reads; both are set to the
        # same text for safety across macOS versions.
        NSLocationUsageDescription: "Sentry can periodically log this Mac's approximate location so your iPhone can show where it was last seen. This only runs while MacStat is open and only if you turn it on in Settings."
        NSLocationWhenInUseUsageDescription: "Sentry can periodically log this Mac's approximate location so your iPhone can show where it was last seen. This only runs while MacStat is open and only if you turn it on in Settings."

  MacStatMobile:
    type: application
    platform: iOS
    # MacStatMobile/Resources/Localizable.xcstrings — same auto-detected
    # mechanism as MacStat/MacStatKit_macOS above. Covers AlertRuleDisplay's
    # AlertCategory names and condition-summary phrasing; the 4 tab labels
    # (`RootTabView`'s `Label("Dashboard"/"History"/"Alerts"/"Settings",
    # systemImage:)`) are plain `LocalizedStringKey` literals already and
    # need no source change — see the MacStat target's comment above for why.
    sources:
      - path: MacStatMobile
    dependencies:
      - target: MacStatKit_iOS
        embed: true
      - target: MacStatWidgetExtension
        embed: true
      # A watchOS `application` target dependency is XcodeGen/Xcode's way of
      # embedding a modern (watchOS 9+, single-target, no legacy WatchKit
      # extension) watch app — it produces an "Embed Watch Content" copy
      # phase rather than the "Embed App Extensions" phase the two widget
      # dependencies above get, since the destination platform differs from
      # this target's own.
      - target: MacStatWatch
        embed: true
      - sdk: WatchConnectivity.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile
      # Simulator builds don't need a signing team, but they DO need the
      # entitlements actually embedded (codesign runs even for the "Sign to
      # Run Locally" identity Xcode uses on Simulator) for the App Group
      # container behind `WidgetSnapshotStore` to work — that's real, not
      # just cosmetic, unlike the project-wide CODE_SIGNING_ALLOWED: NO
      # default in the `base` settings block above, which fully suppresses
      # signing (and therefore entitlement embedding) for the targets that
      # never asked for one. See `WidgetSnapshotStore.swift`'s doc comment
      # for what happens if this ever regresses.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatMobile/MacStatMobile.entitlements
      # Device deployment: personal-team automatic signing. Simulator
      # builds ignore this; device builds need real profiles for the app +
      # every embedded target (see the same block on the widget/watch
      # targets). The Mac app deliberately stays ad-hoc.
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: MacStatMobile/Info.plist
      properties:
        CFBundleDisplayName: Sentry
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for `LocalSyncClient` (`MacStatKit/LocalSync/LocalSyncClient.swift`)
        # to browse for and connect to `LocalSyncServer` over Bonjour/
        # `Network.framework` — iOS gates both local-network `NWBrowser`
        # discovery and any Bonjour service lookup behind these two entries,
        # prompting the user the first time either is used. See
        # `StatsTransport.swift`'s doc comment for why this transport exists
        # at all (CloudKit is blocked on Apple Developer Program enrollment;
        # this one isn't).
        NSLocalNetworkUsageDescription: "Sentry uses your local network to show live data from your Mac when you're on the same Wi-Fi."
        NSBonjourServices:
          - "_macstat._tcp"

  MacStatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      # Both widget targets generate an Info plist into this same directory
      # (Info.plist for iOS, Info-macOS.plist for macOS); excluded here so
      # neither target bundles the other's plist as a stray resource —
      # embeddedBinaryValidationUtility rejects an appex containing a plist
      # whose CFBundleIdentifier isn't prefixed by the parent app's.
      - path: MacStatWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: MacStatKit_iOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile.widget
      PRODUCT_NAME: MacStatWidget
      # See the matching comment on the `MacStatMobile` target above — same
      # reasoning, same App Group, same requirement that entitlements are
      # actually embedded even for an unsigned-by-default project.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatWidget/MacStatWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: MacStatWidget/Info.plist
      properties:
        CFBundleDisplayName: Sentry Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacStatWidgetExtension_macOS:
    type: app-extension
    platform: macOS
    # Embedded in Sentry.app/Contents/PlugIns. An appex is nested code with its
    # own signature, and notarization checks hardened runtime on it separately
    # from the app — a widget without it fails the whole submission.
    templates:
      - DeveloperIDSigned
    sources:
      # Same exclusion as MacStatWidgetExtension above.
      - path: MacStatWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: MacStatKit_macOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.widget
        PRODUCT_NAME: MacStatWidget
        # No entitlements file in either configuration — same provisioning
        # constraint as the MacStat app target above; the store's macOS suite
        # needs none.
        CODE_SIGNING_ALLOWED: YES
      configs:
        Debug:
          # Ad-hoc, so chronod will load the widget from a locally built app.
          # Release swaps this for the Developer ID identity via the template.
          CODE_SIGN_IDENTITY: "-"
    info:
      # Its own generated plist path — the iOS extension's `info:` block
      # already generates MacStatWidget/Info.plist, and two targets writing
      # one path would race on content.
      path: MacStatWidget/Info-macOS.plist
      properties:
        CFBundleDisplayName: Sentry Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacStatWatch:
    type: application
    platform: watchOS
    sources:
      - path: MacStatWatch
    dependencies:
      - target: MacStatKit_watchOS
        embed: true
      - target: MacStatWatchWidgetExtension
        embed: true
      - sdk: WatchConnectivity.framework
    settings:
      # Must extend the iPhone app's identifier followed by "." — iOS
      # refuses to install the phone app otherwise (this was
      # dev.malekswilam.macstat.watch, which blocked every install of
      # MacStatMobile with the watch embedded).
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile.watch
      # The App Group behind `WatchRelayStore` needs its entitlement file
      # actually embedded even under Simulator's "Sign to Run Locally"
      # identity, matching `MacStatMobile`'s identical reasoning above.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatWatch/MacStatWatch.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: MacStatWatch/Info.plist
      properties:
        CFBundleDisplayName: Sentry
        WKApplication: true
        # Pairs this watch app with `MacStatMobile` — required so watchOS
        # knows which iPhone app installs this alongside it, and so
        # `WCSession.isWatchAppInstalled` (read from `WatchRelayManager` on
        # the phone side) resolves correctly instead of always reporting
        # `false`.
        WKCompanionAppBundleIdentifier: dev.malekswilam.macstat.mobile
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  MacStatWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: MacStatWatchWidget
        excludes:
          - "Info*.plist"
    dependencies:
      - target: MacStatKit_watchOS
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      # Extends the watch app's identifier, which itself extends the phone
      # app's — the full chain iOS/watchOS embedding requires.
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mobile.watch.widget
      PRODUCT_NAME: MacStatWatchWidget
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: MacStatWatchWidget/MacStatWatchWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: H7T2D2GL7U
    info:
      path: MacStatWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Sentry Complication
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacStatMCP:
    type: tool
    platform: macOS
    # Copied into Sentry.app/Contents/MacOS by the MacStat target — nested
    # code, so it needs the same identity, hardened runtime and timestamp as
    # its host. The Copy Files phase re-signs it on the way in
    # (`codeSign: true` there); these settings are what the tool is built and
    # signed with beforehand, so `codesign -dv --strict` is clean either way.
    templates:
      - DeveloperIDSigned
    sources:
      - path: MacStatMCP
    dependencies:
      - target: MacStatKit_macOS
        embed: false
      - package: MCP
        product: MCP
        embed: false
        link: true
    # `base:` rather than the flat form — see the note on SystemMetricsKit above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.mcp

  MacStatCLI:
    type: tool
    platform: macOS
    # Same as MacStatMCP above: copied into Sentry.app/Contents/MacOS as
    # `macstat`, so it is notarized nested code rather than a loose binary.
    templates:
      - DeveloperIDSigned
    sources:
      - path: MacStatCLI
    dependencies:
      - target: MacStatKit_macOS
        embed: false
    # `base:` rather than the flat form — see the note on SystemMetricsKit above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.cli
        # EXECUTABLE_NAME (not PRODUCT_NAME) renames just the output binary to
        # "macstat" — PRODUCT_NAME stays "MacStatCLI" so the module name it
        # implies doesn't collide with the "MacStat" app target's own module
        # on a case-insensitive filesystem (this collided as "cannot load
        # module 'macstat' as 'MacStat'" when PRODUCT_NAME was set directly).
        EXECUTABLE_NAME: macstat

  MacStatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacStatTests
    dependencies:
      - target: MacStat
      - target: MacStatKit_macOS
      - target: SystemMetricsKit
      # For APIKeyValidatorTests, which constructs real MCP-SDK HTTPRequest/
      # HTTPValidationContext values — MacStatKit_macOS links MCP too, but
      # this target imports it directly rather than relying on transitive
      # module visibility through the framework.
      - package: MCP
        product: MCP
        embed: false
        link: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.malekswilam.macstat.tests
      # XcodeGen derives TEST_HOST from the target name, not from the
      # PRODUCT_NAME override that renames the app to Sentry — so it must be
      # spelled out or `xcodebuild test` can't find the host binary.
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sentry.app/Contents/MacOS/Sentry"
      BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MacStat:
    build:
      targets:
        MacStat: all
        MacStatMCP: all
        MacStatCLI: all
        MacStatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacStatTests
